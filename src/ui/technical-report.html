<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="appearance.js"></script>
  <link rel="stylesheet" href="theme.css">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Technical Bug Report</title>
  <style>
    html{overflow-x:hidden}body{font:16px system-ui;margin:0;color:var(--c-fg-172b4d);background:var(--c-bg-eef2f6);overflow-x:hidden}
    header{position:sticky;top:0;background:var(--c-bg-ffffff);padding:12px 24px;border-bottom:1px solid var(--c-bd-ccd5df);z-index:2}
    main{max-width:1100px;margin:auto;background:var(--c-bg-ffffff);padding:24px}
    fieldset{margin:20px 0;padding:16px;border:1px solid var(--c-bd-ccd5df);border-radius:6px}
    label{display:block;font-weight:600;margin-top:10px}input,textarea{box-sizing:border-box;width:100%;padding:8px}
    textarea{min-height:80px}button{margin:4px;padding:8px 12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}
    table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}td,th{border:1px solid var(--c-bd-ccd5df);padding:6px;text-align:left}
    img{max-width:100%;height:auto}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
    dialog{box-sizing:border-box;width:min(960px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;padding:20px;border:1px solid var(--c-bd-8392a5);border-radius:8px}
    dialog pre{max-height:320px;overflow:auto;background:var(--c-bg-f5f7fa);padding:12px}
    input[type=checkbox]{width:auto}select{padding:8px}
    .primary-actions{display:flex;gap:8px;align-items:center}.primary-actions button{margin:0}
    .primary-actions #emailReport.is-ready{background:var(--c-bg-008c95);color:var(--c-fg-ffffff);border:1px solid var(--c-bd-007078);border-radius:4px}
    .report-options{margin-top:10px;max-width:760px}.report-options>summary{cursor:pointer;font-weight:600}
    .report-options>details{margin:12px 0;padding:12px;border:1px solid var(--c-bd-ccd5df);border-radius:6px}
    .secondary-actions{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
    .report-core-fields,.report-more-fields{margin:20px 0;padding:16px;border:1px solid var(--c-bd-ccd5df);border-radius:6px}
    .report-more-fields>summary{cursor:pointer;font-weight:600}
    .report-severity-header{display:flex;align-items:center;gap:12px;margin:18px 0}
    .report-severity-header label{margin:0}.report-severity-header select{min-width:160px}
    .report-section{margin:0;padding:24px 0;border:0;border-top:1px solid var(--c-bd-dfe5ec);border-radius:0}
    .report-section>h2{margin:0 0 14px;font-size:1.2rem;color:var(--c-fg-172b4d)}
    .report-section ol{margin-bottom:0;padding-left:28px}
    .technical-details .report-section{padding:16px 0}
    .failure-point{margin:8px 0;padding:10px 12px;border-left:4px solid var(--c-bd-b42318);background:var(--c-bg-fff4f2)}
    .failure-point-label{color:var(--c-fg-8a1c14)}
    .human-actual-result{white-space:pre-wrap}
    .primary-evidence img{display:block;max-height:560px;margin:auto;object-fit:contain}
    .additional-evidence{margin-top:12px}.additional-evidence>summary{cursor:pointer;font-weight:600}
    .screenshot-editor{margin-top:12px}.screenshot-editor>summary{cursor:pointer;font-weight:600}
    .screenshot-include{display:flex;align-items:center;gap:8px;font-weight:400}
    .reproduction-editor{margin-top:12px}.reproduction-editor>summary{cursor:pointer;font-weight:600}
    .reproduction-editor-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:end;margin-top:10px}
    .reproduction-editor-row label{margin:0}.reproduction-editor-row button{margin:0}
    .reproduction-include{display:flex;align-items:center;gap:6px;min-height:36px;white-space:nowrap}
    .technical-details{margin:20px 0;padding:16px;border:1px solid var(--c-bd-8392a5);border-radius:6px}
    .technical-details>summary{cursor:pointer;font-size:1.25rem;font-weight:700}
    .report-incomplete{margin:20px 0;padding:16px;border:1px solid var(--c-bd-e2c384);border-left:5px solid var(--c-bd-b76e00);border-radius:6px;background:var(--c-bg-fffaf0)}.report-incomplete h2{margin-top:0}
    blockquote{margin:12px 0;padding:12px 16px;border-left:5px solid var(--c-bd-b42318);background:var(--c-bg-fff4f2);white-space:pre-wrap}
    @media(max-width:700px){header,main{padding:12px}header{position:static}button{min-height:44px}fieldset{padding:12px}.report-section{padding:18px 0}.reproduction-editor-row{grid-template-columns:1fr}.primary-actions{flex-wrap:wrap}.primary-actions button{flex:1 1 140px}dialog{padding:12px}dialog select{box-sizing:border-box;width:100%}}
    @media(max-width:420px){header,main{padding:8px}.report-core-fields,.report-more-fields,.technical-details{padding:12px}.secondary-actions button{flex:1 1 130px}}
  </style>
  <link rel="stylesheet" href="design-system.css">
  <style>#emailChoice button{min-height:44px}</style>
</head>
<body>
  <header>
    <div class="primary-actions">
      <button id="emailReport" type="button">E-posta PDF</button>
      <button id="exportPdf" type="button">Exportera PDF</button>
      <button id="closeReport" type="button">Close</button>
    </div>
    <details class="report-options"><summary>More options</summary>
      <div class="secondary-actions">
        <button id="undoReport" type="button">Undo</button>
        <button id="redoReport" type="button">Redo</button>
        <button id="regenerateReport" type="button">Generera om från inspelningen</button>
        <button id="downloadMarkdown" type="button">Export Markdown</button>
      </div>
    </details>
    <span id="workspaceMessage" role="status"></span></header>
  <dialog id="emailChoice" aria-labelledby="emailChoiceTitle">
    <h2 id="emailChoiceTitle" data-i18n="outlook.title">Email the report</h2>
    <p data-i18n="outlook.help">Choose Outlook or save an email file.</p>
    <p data-i18n="outlook.permission">Outlook needs permission to read and change your mail.</p>
    <div class="secondary-actions">
      <button id="outlookDraft" type="button" data-i18n="outlook.open">Open draft in Outlook</button>
      <button id="emailFile" type="button" data-i18n="outlook.file">Save email file (.eml)</button>
      <button id="closeEmailChoice" type="button" data-i18n="outlook.close">Close</button>
    </div>
    <p id="outlookStatus" role="status"></p>
    <a id="outlookLink" hidden target="_blank" rel="noopener noreferrer" data-i18n="outlook.open">Open draft in Outlook</a>
  </dialog>
  <main id="technicalReport" aria-live="polite"></main>
  <script src="engine/locale-catalogs.js"></script>
  <script src="engine/language-registry.js"></script>
<script src="engine/page-identity.js"></script>
<script src="engine/process-taxonomy-schema.js"></script>
<script src="engine/canonical-semantic-model.js"></script>
<script src="engine/canonical-recording.js"></script>
  <script src="i18n.js"></script>
  <script src="engine/text-format.js"></script>
  <script src="bug-report/bug-report-model.js"></script>
  <script src="bug-report/bug-report-completeness.js"></script>
  <script src="bug-report/bug-report-generator.js"></script>
  <script src="bug-report/bug-report-text-export.js"></script>
  <script src="bug-report/technical-report-workspace.js"></script>
  <script src="bug-report/email-draft.js"></script>
<script src="engine/tenant-license-config.js"></script>
<script src="bug-report/outlook-draft.js"></script>
  <script src="bug-report/report-pdf.bundle.js"></script>
  <script src="engine/screenshot-asset-paths.js"></script>
  <script src="engine/screenshot-batch-loader.js"></script>
  <script src="technical-report-workspace-view.js"></script>
<script src="tooltips.js"></script>
<script src="technical-report.js"></script>
</body>
</html>
