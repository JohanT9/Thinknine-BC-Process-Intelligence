<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="appearance.js"></script>
  <link rel="stylesheet" href="theme.css">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Test protocol</title>
  <link rel="stylesheet" href="design-system.css">
  <style>
    html{overflow-x:hidden}body{font:15px system-ui;margin:0;color:var(--c-fg-172b4d);background:var(--c-bg-eef2f6);overflow-x:hidden}
    .protocol-toolbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 24px;background:var(--c-bg-ffffff);border-bottom:1px solid var(--c-bd-ccd5df)}
    .protocol-toolbar button{margin:0;min-height:40px}
    .protocol-toolbar label{display:inline-flex;align-items:center;gap:6px;font-weight:400}
    .protocol-toolbar p{margin:0;flex:1 1 240px;min-width:0;font-size:.875rem;color:var(--c-fg-526273)}
    /* The protocol itself reads like paper in both themes. */
    .protocol{box-sizing:border-box;max-width:960px;margin:16px auto;padding:32px 40px;background:#fff;color:#1b1b1b;box-shadow:0 1px 4px rgb(0 0 0 / 15%)}
    .protocol{color-scheme:light}.protocol :is(h1,h2,h3){color:#1b1b1b}
    .protocol table{background:#fff}.protocol td{color:#1b1b1b;background:#fff;height:auto}
    .protocol th{color:#1b1b1b;height:auto}.protocol :is(th,td){border-color:#c8ced6 !important}
    .protocol h1{margin:0 0 4px;font-size:1.5rem;overflow-wrap:anywhere}
    .protocol h2{margin:24px 0 8px;font-size:1.1rem;border-bottom:1px solid #d0d5db;padding-bottom:4px}
    .protocol p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
    .protocol table{width:100%;border-collapse:collapse;font-size:.875rem}
    .protocol th,.protocol td{border:1px solid #c8ced6;padding:6px 8px;text-align:left;vertical-align:top;overflow-wrap:break-word}
    .protocol th{background:#f1f3f5}
    .protocol .meta th{width:28%}
    .protocol .steps th:first-child,.protocol .steps td:first-child{width:2.5em;text-align:right}
    .protocol .steps .section{display:block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#4b5563}
    .protocol .result-failed{color:#a4161a;font-weight:700}.protocol .result-passed{color:#14632d;font-weight:700}
    .protocol .table-wrap{overflow-x:auto}
    .protocol figure{margin:0 0 12px;break-inside:avoid}
    .protocol figure img{display:block;max-width:100%;border:1px solid #c8ced6}
    .protocol figcaption{font-size:.8125rem;color:#4b5563;margin-top:4px}
    .protocol .overview th:first-child,.protocol .overview td:first-child{width:2.5em;text-align:right}
    .protocol .result-missing{color:#4b5563}
    .protocol-test{margin-top:32px;padding-top:16px;border-top:2px solid #d0d5db}
    .protocol .protocol-test h2{margin:0 0 8px;font-size:1.25rem;border-bottom:0;padding-bottom:0}
    .protocol .protocol-test h3{margin:20px 0 8px;font-size:1rem;border-bottom:1px solid #d0d5db;padding-bottom:4px}
    .signatures{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:8px}
    .signature h3{margin:0 0 12px;font-size:1rem}
    .signature-line{display:grid;grid-template-columns:7.5em 1fr;align-items:end;gap:8px;margin:0 0 18px;font-size:.875rem}
    .signature-line span:last-child{border-bottom:1px solid #1b1b1b;min-height:1.6em}
    @media(max-width:640px){.protocol-toolbar{padding:10px 16px}.protocol{margin:0;padding:20px 16px;box-shadow:none}.signatures{grid-template-columns:1fr}}
    @media print{
      :root,:root[data-theme]{color-scheme:light}html,body{background:#fff}.protocol-toolbar{display:none}
      .protocol{margin:0;padding:0;max-width:none;box-shadow:none}
      .protocol tr,.protocol .signatures{break-inside:avoid}.protocol :is(h1,h2,h3){break-after:avoid}
      .protocol .table-wrap{overflow:visible}
      .protocol-test{break-before:page;margin-top:0;padding-top:0;border-top:0}
    }
  </style>
</head>
<body>
  <div class="protocol-toolbar">
    <button id="printProtocol" type="button" class="primary" data-i18n="test.protocolPrint">Print or save as PDF</button>
    <label><input id="includeScreenshots" type="checkbox" checked> <span data-i18n="test.protocolIncludeScreenshots">Include screenshots</span></label>
    <p id="protocolStatus" role="status" data-i18n="test.protocolHelp">Choose Save as PDF in the print dialog to get a PDF file.</p>
  </div>
  <main id="protocol" class="protocol" data-i18n-ignore></main>
  <script src="engine/locale-catalogs.js"></script>
  <script src="engine/language-registry.js"></script>
  <script src="i18n.js"></script>
  <script src="document/test-script.js"></script>
  <script src="test-protocol.js"></script>
</body>
</html>
