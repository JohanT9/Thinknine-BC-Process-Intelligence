<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Thinknine BC Recorder Debug</title>
<style>
body{font-family:"Segoe UI",Arial,sans-serif;max-width:850px;margin:35px auto;padding:0 20px;color:#1f2933}
h1{margin-bottom:5px}.muted{color:#52606d}
.grid{display:grid;grid-template-columns:220px 1fr;gap:1px;background:#d8dee5;border:1px solid #d8dee5}
.label,.value{padding:10px;background:white}.label{font-weight:600}
.ok{color:#166534}.error{color:#b42318}
button{margin-top:16px;border:0;border-radius:5px;padding:9px 13px;font-weight:600;cursor:pointer;background:#0f6cbd;color:white}
pre{white-space:pre-wrap;background:#f3f4f6;padding:12px;border-radius:6px}
</style>
</head>
<body>
<h1>Thinknine BC Recorder Debug</h1>
<p class="muted">Här ser vi vad tillägget faktiskt gör, i stället för att tolka tystnad som ett användargränssnitt.</p>
<div id="grid" class="grid"></div>
<button id="refresh">Uppdatera</button>
<h2>Rå diagnostik</h2>
<pre id="raw"></pre>
<script src="debug.js"></script>
</body>
</html>
