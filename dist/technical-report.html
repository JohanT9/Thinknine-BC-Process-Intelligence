<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Technical Bug Report</title>
  <style>
    body{font:16px system-ui;margin:0;color:#172b4d;background:#eef2f6}
    header{position:sticky;top:0;background:white;padding:12px 24px;border-bottom:1px solid #ccd5df;z-index:2}
    main{max-width:1100px;margin:auto;background:white;padding:24px}
    section,fieldset{margin:20px 0;padding:16px;border:1px solid #ccd5df;border-radius:6px}
    label{display:block;font-weight:600;margin-top:10px}input,textarea{box-sizing:border-box;width:100%;padding:8px}
    textarea{min-height:80px}button{margin:4px;padding:8px 12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}
    table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccd5df;padding:6px;text-align:left}
    img{max-width:100%;height:auto}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header><button id="saveReport" type="button">Save</button>
    <button id="undoReport" type="button">Undo</button>
    <button id="redoReport" type="button">Redo</button>
    <button id="copyMarkdown" type="button">Copy full report</button>
    <button id="downloadMarkdown" type="button">Export Markdown</button>
    <label><input id="includeAiExport" type="checkbox"> Include AI analysis in copy/export</label>
    <details><summary>Application Insights (optional)</summary>
      <label>Tenant ID <input id="telemetryTenantId" autocomplete="off"></label>
      <label>Public client ID <input id="telemetryClientId" autocomplete="off"></label>
      <label>Application Insights App ID <input id="telemetryApplicationId" autocomplete="off"></label>
      <label>Expected environment <input id="telemetryEnvironment" autocomplete="off"></label>
      <label><input id="telemetryEnabled" type="checkbox"> Enable optional enrichment</label>
      <label>Window (minutes) <input id="telemetryWindow" type="number" min="1" max="30" value="5"></label>
      <button id="saveTelemetryConfig" type="button">Save telemetry configuration</button>
      <button id="testTelemetry" type="button">Test telemetry connection</button>
      <button id="refreshTelemetry" type="button">Refresh telemetry for selected error</button>
    </details>
    <details><summary>AI technical analysis (optional)</summary>
      <p>Explicit analysis sends a minimized, redacted technical evidence package
        to your configured Entra-protected broker. Screenshots, raw events, raw
        diagnostics, tenant/company/user/session IDs and raw telemetry are excluded.</p>
      <label>Tenant ID <input id="aiTenantId" autocomplete="off"></label>
      <label>Public client ID <input id="aiClientId" autocomplete="off"></label>
      <label>Broker OAuth scope <input id="aiScope" autocomplete="off"></label>
      <label>HTTPS broker URL <input id="aiBrokerUrl" type="url" autocomplete="off"></label>
      <label>Provider model <input id="aiModel" autocomplete="off"></label>
      <label><input id="aiEnabled" type="checkbox"> Organization policy enables AI analysis</label>
      <label><input id="aiIncludeTelemetry" type="checkbox"> Include filtered telemetry events</label>
      <label><input id="aiIncludeTelemetryMessages" type="checkbox"> Include redacted telemetry messages</label>
      <label><input id="aiIncludeNotes" type="checkbox"> Include redacted human notes</label>
      <label><input id="aiConsent" type="checkbox"> I understand that the selected evidence will leave this extension</label>
      <button id="saveAiConfig" type="button">Save public broker configuration</button>
      <button id="analyzeBugReport" type="button">Analyze technical evidence</button>
      <button id="removeAiAnalysis" type="button">Remove AI analysis</button>
    </details>
    <span id="workspaceMessage" role="status"></span></header>
  <main id="technicalReport" aria-live="polite"></main>
  <script src="bug-report/bug-report-model.js"></script>
  <script src="bug-report/bug-report-completeness.js"></script>
  <script src="bug-report/ai-evidence-policy.js"></script>
  <script src="bug-report/ai-analysis-input.js"></script>
  <script src="bug-report/ai-analysis-model.js"></script>
  <script src="bug-report/ai-analysis-prompt.js"></script>
  <script src="bug-report/bug-report-generator.js"></script>
  <script src="bug-report/bug-report-text-export.js"></script>
  <script src="bug-report/technical-report-workspace.js"></script>
  <script src="technical-report-workspace-view.js"></script>
  <script src="technical-report.js"></script>
</body>
</html>
